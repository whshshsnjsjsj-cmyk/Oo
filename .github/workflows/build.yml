name: build-arm64
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch AML and CLEOMod headers
        run: |
          git clone --depth 1 https://github.com/RusJJ/AndroidModLoader aml
          git clone --depth 1 https://github.com/AndroidModLoader/GTA_CLEOMod cleomod
          echo "CLEO_H=$(dirname "$(find cleomod -name cleo.h | head -1)")" >> $GITHUB_ENV
          echo "AML_H=$(dirname "$(dirname "$(find aml -path '*mod/amlmod.h' | head -1)")")" >> $GITHUB_ENV
      - name: Build arm64-v8a
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release \
            -DAML_DIR=$AML_H -DCLEO_SDK_DIR=$CLEO_H
          cmake --build build -j
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-arm64
          path: build/*.so
